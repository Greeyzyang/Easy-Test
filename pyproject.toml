[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi_project"
version = "0.1.0"
description = "FastAPI Project with Authentication and Permissions"
requires-python = ">=3.8"
typeCheckingMode = "off"
dependencies = [
    "reportlab==4.0.4",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "sqlalchemy>=1.4.0",
    "alembic>=1.7.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.5",
    "aiosqlite>=0.17.0",
    "pyasn1>=0.6.1,<0.7.0",
    "celery[redis]>=5.3.0",
    "redis>=4.5.0",
    "jira>=3.7.2",
    "openai>=1.3.7",
    "openpyxl>=3.1.2",
    "httpx>=0.25.0",
    "jsonpath-rw>=1.4.0",
    "python-dotenv>=1.0.0",
    "fastapi-users>=12.1.0",
    "fastapi-users-db-sqlalchemy>=12.1.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "requests>=2.31.0"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."] 
