name: CI/CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/easy-test-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/easy-test-frontend:latest
          build-args: |
            VUE_APP_BASE_API=/prod-api

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: appleboy/scp-action@v0.1.7
        if: ${{ env.SSH_PRIVATE_KEY != '' || env.SSH_PASSWORD != '' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,.env"
          target: "/easy-test"
      - uses: appleboy/ssh-action@v1.0.0
        if: ${{ env.SSH_PRIVATE_KEY != '' || env.SSH_PASSWORD != '' }}
        env:
          GHCR_USER: ${{ env.OWNER_LC }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ env.SSH_PASSWORD }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_PAT
          script: |
            set -euo pipefail
            echo "[Deploy] Host: $(hostname), User: $(whoami)"
            cd /easy-test
            echo "[Deploy] Working dir: $(pwd)"
            echo "[Deploy] Files:"
            ls -la
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: docker not installed"
              exit 1
            fi
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "ERROR: docker compose not installed"
              exit 1
            fi
            if [ -n "$GHCR_PAT" ]; then
              echo "[Deploy] Login GHCR as $GHCR_USER"
              docker login ghcr.io -u "$GHCR_USER" -p "$GHCR_PAT"
            else
              echo "[Deploy] GHCR_PAT not set, assuming public images"
            fi
            echo "[Deploy] Compose config preview:"
            $DC -f docker-compose.prod.yml config || { echo "ERROR: compose config failed"; exit 1; }
            echo "[Deploy] Pull images"
            $DC -f docker-compose.prod.yml pull
            echo "[Deploy] Up services"
            $DC -f docker-compose.prod.yml up -d
            echo "[Deploy] Services status"
            $DC ps
