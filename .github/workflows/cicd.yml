name: CI/CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - name: Print build context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Owner: $GITHUB_REPOSITORY_OWNER"
          echo "Owner LC: $OWNER_LC"
          echo "Runner: $RUNNER_NAME ($RUNNER_OS $RUNNER_ARCH)"
          echo "Ref: $GITHUB_REF_NAME @ $GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - name: Docker diagnostics
        run: |
          docker version
          docker info | head -n 50
          docker buildx version || true
          docker buildx ls || true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Show image tags to push
        run: |
          echo "Backend tag: ghcr.io/${OWNER_LC}/easy-test-backend:latest"
          echo "Frontend tag: ghcr.io/${OWNER_LC}/easy-test-frontend:latest"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/easy-test-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/easy-test-frontend:latest
          build-args: |
            VUE_APP_BASE_API=/prod-api

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    environment: autotest
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase owner
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,.env"
          target: "/easy-test"
          debug: true
          timeout: 600
          command_timeout: 600
      - uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_USER: ${{ env.OWNER_LC }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_PAT
          timeout: 600
          command_timeout: 1800
        script: |
            set -euo pipefail
            echo "[Deploy] Host: $(hostname), User: $(whoami)"
            cd /easy-test
            echo "[Deploy] Working dir: $(pwd)"
            echo "[Deploy] Files:"
            ls -la
            echo "[Deploy] GHCR_USER=$GHCR_USER"
            echo "[Deploy] GHCR_PAT length: $(echo -n \"$GHCR_PAT\" | wc -c)"
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: docker not installed"
              exit 1
            fi
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "ERROR: docker compose not installed"
              exit 1
            fi
            if [ -n "$GHCR_PAT" ]; then
              echo "[Deploy] Login GHCR as $GHCR_USER"
              docker login ghcr.io -u "$GHCR_USER" -p "$GHCR_PAT"
            else
              echo "[Deploy] GHCR_PAT not set, assuming public images"
            fi
            echo "[Deploy] Compose config preview:"
            $DC -f docker-compose.prod.yml config || { echo "ERROR: compose config failed"; exit 1; }
            echo "[Deploy] Pull images"
            $DC -f docker-compose.prod.yml pull --quiet mysql redis || true
            $DC -f docker-compose.prod.yml pull --quiet backend
            $DC -f docker-compose.prod.yml pull --quiet celery_worker
            $DC -f docker-compose.prod.yml pull --quiet celery_beat
            $DC -f docker-compose.prod.yml pull --quiet frontend
            echo "[Deploy] Local images (top 20)"
            docker images | head -n 20 || true
            echo "[Deploy] Up services"
            $DC -f docker-compose.prod.yml up -d
            echo "[Deploy] Services status"
            $DC ps
