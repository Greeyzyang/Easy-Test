image: python:3.14

pipelines:
  branches:
    master:
      - step:
          name: Build & Deploy to Production
          deployment: production
          script:
            # 生成 .env 文件
            - |
              echo "[1/4] Generating .env file..."
              cat << 'ENVEOF' > .env
              MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD
              MYSQL_DATABASE=$MYSQL_DATABASE
              MYSQL_USER=$MYSQL_USER
              MYSQL_PASSWORD=$MYSQL_PASSWORD
              DATABASE_URL_PROD=$DATABASE_URL_PROD
              REDIS_URL_PROD=$REDIS_URL_PROD
              SECRET=$SECRET
              SERVER_BASE_URL=$SERVER_BASE_URL
              SMTP_USERNAME=$SMTP_USERNAME
              SMTP_PASSWORD=$SMTP_PASSWORD
              JIRA_USER=$JIRA_USER
              JIRA_API_TOKEN=$JIRA_API_TOKEN
              LLM_API_KEY=$LLM_API_KEY
              ENVEOF
              echo "[1/4] .env generated."

            # 设置 SSH 私钥
            - |
              set +x
              mkdir -p ~/.ssh
              echo "$SSH_KEY" > ~/.ssh/id_rsa
              chmod 600 ~/.ssh/id_rsa
              set -x

            # 上传所有源码到服务器
            - |
              echo "[2/4] Uploading files to server ($SSH_HOST)..."
              scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa \
                docker-compose.prod.yml \
                Dockerfile.backend \
                Dockerfile.frontend \
                Dockerfile.nginx \
                nginx.conf \
                pyproject.toml \
                .env \
                app/ \
                $SSH_USER@$SSH_HOST:/tmp/easy-test/
              echo "[2/4] Files uploaded."

            # SSH 登录服务器执行构建和部署
            - |
              ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SSH_USER@$SSH_HOST /bin/bash << 'SCRIPT'

              echo "[3/4] Stopping old containers..."
              mkdir -p /easy-test
              docker compose -f /tmp/easy-test/docker-compose.prod.yml down || true

              echo "[3/4] Copying new files..."
              cp -r /tmp/easy-test/* /easy-test/

              echo "[3/4] Building Docker images..."
              docker compose -f /easy-test/docker-compose.prod.yml build --pull backend frontend nginx celery_worker celery_beat

              echo "[3/4] Starting all services..."
              docker compose -f /easy-test/docker-compose.prod.yml up -d --remove-orphans

              echo "[3/4] Waiting for backend to be healthy..."
              timeout 120 bash -c '
                while true; do
                  _status=$(docker inspect --format="{{.State.Health.Status}}" easy-test-backend 2>/dev/null || echo "starting")
                  if [ "$_status" = "healthy" ]; then
                    break
                  fi
                  echo "  Backend status: $_status, waiting..."
                  sleep 5
                done
              ' || echo "Warning: backend health check did not complete in time"

              echo "[4/4] Running database migrations..."
              docker compose -f /easy-test/docker-compose.prod.yml exec -T backend alembic upgrade head

              echo ""
              echo "========== Deployment Complete =========="
              docker compose -f /easy-test/docker-compose.prod.yml ps
              echo "========================================="

              echo "[4/4] Cleaning up temporary files..."
              rm -rf /tmp/easy-test
              echo "[4/4] Done."

              SCRIPT
